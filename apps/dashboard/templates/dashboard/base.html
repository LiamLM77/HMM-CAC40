{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}HMM CAC40{% endblock %}</title>
    {% tailwind_css %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        body { background-color: #0f172a; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <nav class="bg-slate-950/80 backdrop-blur border-b border-slate-800 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-16">
            <span class="font-bold text-lg tracking-tight text-white">📊 HMM <span class="text-emerald-400">CAC40</span></span>
            <div class="flex gap-2 text-sm">
                <a href="{% url 'dashboard:accueil' %}" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-emerald-400 transition">Accueil</a>
                <a href="{% url 'dashboard:performance' %}" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-emerald-400 transition">Performance</a>
                <a href="{% url 'dashboard:regimes' %}" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-emerald-400 transition">Régimes</a>
                <a href="{% url 'dashboard:betas' %}" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-emerald-400 transition">Bêtas</a>
                <a href="{% url 'dashboard:allocations' %}" class="px-3 py-2 rounded-md hover:bg-slate-800 hover:text-emerald-400 transition">Allocations</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 rounded-md px-4 py-3 text-sm border
                    {% if message.tags == 'success' %}bg-emerald-500/10 text-emerald-400 border-emerald-500/30{% else %}bg-red-500/10 text-red-400 border-red-500/30{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenu %}{% endblock %}
    </main>
</body>
</html>
